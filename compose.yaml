services:
  novnc:
    user: "root"
    container_name: novnc
    volumes:
      - ./:/opt/novnc:rw
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    tty: true
    stdin_open: true
    networks:
      - swarm_net

networks:
  swarm_net:
    external: true
    name: swarm-stack_vnc_net
    